<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord Server Structure Builder</title>
  <style>
    :root { --bg: #313338; --panel: #2b2d31; --dark: #1e1f22; --text: #dbdee1; --accent: #5865f2; --success: #23a55a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--dark); color: var(--text); padding: 24px; display: flex; flex-direction: column; align-items: center; }
    .container { display: grid; grid-template-columns: 1fr 320px; gap: 20px; width: 100%; max-width: 1200px; margin-top: 20px; }
    .box { background: var(--panel); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    textarea { width: 100%; height: 350px; background: var(--dark); color: #fff; border: 1px solid #444; border-radius: 4px; padding: 12px; font-family: monospace; font-size: 0.9rem; resize: none; }
    button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
    button:hover { opacity: 0.9; }
    button.copy-cmd { background: var(--success); }
    .preview-pane { background: var(--dark); border-radius: 6px; padding: 10px; height: 350px; overflow-y: auto; border: 1px solid #444; }
    .cat { font-size: 0.75rem; font-weight: bold; color: #80848e; margin-top: 12px; text-transform: uppercase; }
    .ch { display: flex; gap: 6px; padding: 4px 8px; font-size: 0.9rem; color: #949ba4; }
    header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 12px; }
  </style>
</head>
<body>

  <header>
    <h2>Discord Server Architect</h2>
    <span style="color: #949ba4; font-size: 0.85rem;">GitHub Pages Production Dashboard</span>
  </header>

  <div class="container">
    <div class="box">
      <h3>1. Design Channels Layout</h3>
      <textarea id="rawInput">WELCOME
  #rules
  #announcements

COMMUNITY
  #general-chat
  #memes-and-media
  🔊 Lounge
  🔊 Gaming Voice</textarea>
      <button class="copy-cmd" onclick="copyBotCommand()">Copy Slash Command Payload</button>
    </div>

    <div class="box">
      <h3>2. Live Discord Preview</h3>
      <div id="preview" class="preview-pane"></div>
      <p style="font-size: 0.8rem; color: #949ba4; text-align: center;">Paste the generated string directly into your Discord server command option.</p>
    </div>
  </div>

  <script>
    const input = document.getElementById('rawInput');
    const preview = document.getElementById('preview');

    function parseText(text) {
      const lines = text.split('\n');
      const categories = [];
      let currentCategory = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        if (trimmed.startsWith('#')) {
          const name = trimmed.replace(/^#\s*/, '').toLowerCase().replace(/\s+/g, '-');
          if (!currentCategory) { currentCategory = { name: 'UNCATEGORIZED', channels: [] }; categories.push(currentCategory); }
          currentCategory.channels.push({ name, type: 'text' });
        } else if (trimmed.startsWith('🔊') || trimmed.toLowerCase().startsWith('[voice]')) {
          const name = trimmed.replace(/^🔊\s*|^\[voice\]\s*/i, '');
          if (!currentCategory) { currentCategory = { name: 'UNCATEGORIZED', channels: [] }; categories.push(currentCategory); }
          currentCategory.channels.push({ name, type: 'voice' });
        } else {
          currentCategory = { name: trimmed.toUpperCase(), channels: [] };
          categories.push(currentCategory);
        }
      });
      return categories;
    }

    function updatePreview() {
      const parsed = parseText(input.value);
      preview.innerHTML = parsed.map(c => `
        <div class="cat">▼ ${c.name}</div>
        ${c.channels.map(ch => `<div class="ch"><span>${ch.type === 'text' ? '#' : '🔊'}</span> ${ch.name}</div>`).join('')}
      `).join('');
    }

    function copyBotCommand() {
      const structure = parseText(input.value);
      const minifiedJson = JSON.stringify(structure);
      const command = `/buildserver data:${minifiedJson}`;
      
      navigator.clipboard.writeText(command).then(() => {
        alert('✅ Command copied! Go to Discord and paste it into your server.');
      });
    }

    input.addEventListener('input', updatePreview);
    updatePreview();
  </script>
</body>
</html>
